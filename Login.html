<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:#aba1ef;

    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding-top:80px;
}

h1{
    margin-bottom:25px;
    font-size:32px;
}

#formPaciente{

    width:100%;
    max-width:380px;

    background:rgba(255,255,255,0.10);

    padding:25px;

    border-radius:18px;

    display:flex;
    flex-direction:column;

    gap:18px;
}

.campo{
    display:flex;
    flex-direction:column;
    gap:8px;
}

label{
    font-weight:700;
    font-size:15px;
}

input{

    padding:14px;

    border:none;

    border-radius:12px;

    font-size:16px;

    outline:none;
}

button{

    margin-top:10px;

    padding:16px;

    border:none;

    border-radius:14px;

    background:#37698d;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.2s;
}

button:hover{
    filter:brightness(1.1);
}


</style>
<body>

    <h1>Login de Usuario</h1>

    <form id="formPaciente">

        <div class="campo">
            <label for="nomeUser">Usuario</label>

            <input
                type="text"
                id="nomeUser"
                placeholder="Nome Usuario"
                required>
        </div>

        <br>

        <div class="campo">
            <label for="Password">Senha</label>

            <input
                type="password"
                id="Password"
                placeholder="Senha"
                required>
        </div>

        <br>

        <button type="submit">
            Acessar Sistema
        </button>


        <p id="mensagem"></p>
        
    </form>

    <script>

const form = document.getElementById("formPaciente");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const nomeUser = document.getElementById("nomeUser").value;
    const Password = document.getElementById("Password").value;

    const msg = document.getElementById("mensagem");

    try {

        const resposta = await fetch("/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                USUARIO: nomeUser,
                SENHA: Password
            })

        });

        const dados = await resposta.json();

        console.log(dados);

        msg.textContent = dados.mensagem;

        if (resposta.ok) {
            msg.style.color = "green";
        } else {
            msg.style.color = "red";
        }

    } catch (erro) {

        console.log(erro);

       msg.textContent = dados.mensagem + " 🐾";

if (resposta.ok) {

    msg.style.color = "#1f7a1f";
    msg.style.fontWeight = "bold";

} else {

    msg.style.color = "#b22222";
    msg.style.fontWeight = "bold";
}
    }

});

</script>

</body>

</html>
