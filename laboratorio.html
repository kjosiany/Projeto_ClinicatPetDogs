<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Laboratório - ClinicatPetDogs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #f1f5f9;
            padding: 20px;
            color: #1e293b;
            padding-top: 90px !important;
        }
        .container-lab { max-width: 1100px; margin: 0 auto; }
        .cabecalho-lab { text-align: center; margin-bottom: 25px; }
        .cabecalho-lab h2 { font-size: 26px; color: #1e293b; font-weight: 700; }
        .cabecalho-lab p { color: #64748b; font-size: 14px; margin-top: 5px; }

        .secao-tabela {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-top: 4px solid #f97316;
        }
        .secao-tabela h3 { font-size: 16px; color: #475569; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background-color: #f8fafc; color: #64748b; padding: 12px; font-weight: 600; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        tr:hover { background-color: #f8fafc; }

        .badge-pendente { background: #fef3c7; color: #d97706; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .badge-paciente { background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 6px; font-weight: bold; text-transform: uppercase; }

        .form-laudo { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        input[type="text"], textarea {
            width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px;
            font-size: 13px; outline: none; font-family: inherit; background-color: #fcfdfd;
        }
        input[type="text"]:focus, textarea:focus { border-color: #f97316; background-color: #fff; }
        textarea { resize: vertical; min-height: 50px; }

        .btn-enviar-laudo {
            background-color: #f97316; color: white; border: none; padding: 8px 14px;
            border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
            transition: background 0.2s; align-self: flex-end;
        }
        .btn-enviar-laudo:hover { background-color: #ea580c; }

        .navbar {
            width: 100%; background-color: #37698d; padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .nav-logo { color: white; font-size: 18px; font-weight: bold; }
        .nav-links a { color: #eef2f7; text-decoration: none; font-weight: 600; font-size: 13px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">ClinicatPetDogs 🐾 <span style="font-size: 12px; font-weight: normal; background: #ea580c; padding: 2px 6px; border-radius: 4px; margin-left: 5px;">Módulo Lab</span></div>
        <div class="nav-links"><a href="/painel">Voltar ao Painel</a></div>
    </nav>

    <div class="container-lab">
        <div class="cabecalho-lab">
            <h2>Área de Análises Clínicas e Diagnóstico </h2>
            <p>Fila de exames solicitados pelos veterinários</p>
        </div>

        <div class="secao-tabela">
            <h3>Solicitações Pendentes</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID Atend.</th>
                        <th>Paciente / Pet</th>
                        <th>Exame Solicitado</th>
                        <th>Status</th>
                        <th>Lançar Laudo / Resultado Técnico</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr>
                        <td colspan="5" style="color: #64748b; font-style: italic; text-align: center; padding: 20px;">
                            Buscando exames pendentes no servidor...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        buscarExamesPendentes();
        setInterval(buscarExamesPendentes, 5000);

        function buscarExamesPendentes() {
            fetch("http://localhost:3001/atendimentos")
            .then(res => res.json())
            .then(atendimentos => {
                const tbody = document.getElementById("corpoTabela");
                let countPendentes = 0;
                let promessas = [];

                atendimentos.forEach(at => {
                    if (at.SITUACAO === "FINALIZADO") return;

                    const p = fetch(`http://localhost:3001/atendimentos/${at.ID_ATENDIMENTO}/exames`)
                        .then(r => r.json())
                        .then(exames => {
                            return { 
                                idAtendimento: at.ID_ATENDIMENTO, 
                                paciente: at.PACIENTE, 
                                especie: at.especie || "Não informada",
                                exames: exames 
                            };
                        });
                    promessas.push(p);
                });

                Promise.all(promessas).then(resultados => {
                    tbody.innerHTML = "";

                    resultados.forEach(res => {
                        const pendentes = res.exames.filter(ex => ex.STATUS === "SOLICITADO");
                        
                        pendentes.forEach(ex => {
                            countPendentes++;
                            tbody.innerHTML += `
                                <tr>
                                    <td style="font-weight: bold; color: #37698d;">#${res.idAtendimento}</td>
                                    <td><span class="badge-paciente">🐾 ${res.paciente}</span> <small style="color:#64748b; block">(${res.especie})</small></td>
                                    <td><strong style="text-transform: uppercase;">🧪 ${ex.NOME_EXAME}</strong></td>
                                    <td><span class="badge-pendente">${ex.STATUS}</span></td>
                                    <td>
                                        <div class="form-laudo">
                                            <input type="text" id="resp_${ex.ID_EXAME}" placeholder="Nome do Patologista/Laboratório" required>
                                            <textarea id="laudo_${ex.ID_EXAME}" placeholder="Digite o resultado do laudo/valores de referência..." required></textarea>
                                            <button class="btn-enviar-laudo" onclick="enviarLaudo(${ex.ID_EXAME})">Liberar Resultado 🔓</button>
                                        </div>
                                    </td>
                                </tr>
                            `;
                        });
                    });

                    if (countPendentes === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="5" style="color: #64748b; font-style: italic; text-align: center; padding: 30px;">
                                    🎉 Nenhum exame pendente na fila do laboratório!
                                </td>
                            </tr>
                        `;
                    }
                });
            })
            .catch(err => console.error("Erro ao carregar fila:", err));
        }

        function enviarLaudo(idExame) {
            const responsavel = document.getElementById(`resp_${idExame}`).value.trim();
            const laudo = document.getElementById(`laudo_${idExame}`).value.trim();

            if (!responsavel || !laudo) {
                alert("Por favor, preencha quem é o responsável e o texto do laudo antes de liberar!");
                return;
            }

            fetch(`http://localhost:3001/exames/${idExame}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    LABORATORIO_RESPONSAVEL: responsavel,
                    RESULTADO_LAUDO: laudo
                })
            })
            .then(res => {
                if(!res.ok) throw new Error();
                alert("Exame liberado! Pet movido de volta para a coluna 'Em Atendimento' 🐾");
                buscarExamesPendentes();
            })
            .catch(() => alert("Erro ao salvar o laudo."));
        }
    </script>
</body>
</html>
