<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Pacientes - ClinicatPetDogs</title>

<style>body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #aba1ef;
    padding: 20px;
}

#Painel {
    width: 100%;
    text-align: center;
    margin-bottom: 30px;
}

#Painel h3 {
    font-size: 26px;
    color: #000;
}

#Painel::after {
    content: "";
    display: block;
    width: 100px;
    height: 3px;
    background-color: #37698d;
    margin: 10px auto 0;
    border-radius: 2px;
}

.container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.container > div {
    background: #ffffff;
    border-radius: 12px;
    padding: 15px;
    min-height: 400px;
    border-top: 6px solid;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

#AgurdandoAtendi {
    border-color: #fbc02d;
}

#emAtendimento {
    border-color: #0288d1;
}

#EmObservacao {
    border-color: #fb8c00;
}

#EmInternacao {
    border-color: #e53935;
}

h1 {
    font-size: 18px;
    margin-bottom: 10px;
    color: #000;
    border-bottom: 1px solid #ddd;
    padding-bottom: 5px;
}

p {
    background: #dccefe; 
    border-left: 4px solid #37698d;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    color: #000;
}
p:hover {
    transform: scale(1.02);
    transition: 0.2s;
    cursor: pointer;
    background: #eef2f3;
}
</style>

</head>
<body>

    <div id= "Painel">
    <H3>Painel de Atendimento Veterinário</H3>
    </div>

    <div class="container">

    
    <div id="AgurdandoAtendi">
    <h1>Aguardando Atendimento</h1>
    <div id="listaaguaatend">
        </div>
</div> 
<div id="emAtendimento">
    <h1>Em Atendimento</h1>
    <div id="listaatendimento">
        </div>
</div>

<div  id= "EmObservacao">
<h1> Em Observaçao</h1>
<div id ="listaEmObs">
</div>
</div>

<div  id= "EmInternacao">
<h1> Em Internaçao</h1>
<div id ="listaInterna">
</div>
</div>

</div>

<script>
const divPendentes = document.getElementById('listaaguaatend');
const divProntos = document.getElementById('listaatendimento');
const divobs = document.getElementById ('listaEmObs');
const divInterna = document.getElementById ('listaInterna')
function carregarAtendimentos() {


fetch("http://localhost:3001/atendimentos",
   { method: "GET"}
)
  .then(response => response.json())
  .then(atendimentos => {
    console.log(atendimentos);

divPendentes.innerHTML = "";
divProntos.innerHTML = "";
divobs.innerHTML = "";
divInterna.innerHTML = "";

    atendimentos.forEach(atendimento => {
      const situacao = atendimento.SITUACAO
      ;

      if ( situacao === "AGUARDANDO ATENDIMENTO") {
        divPendentes.innerHTML += 
          `<p>Paciente: ${atendimento.PACIENTE} | Espécie: ${atendimento.especie}</p>`;

      } else if (situacao === "EM ATENDIMENTO") {
        divProntos.innerHTML += 
          `<p>Paciente: ${atendimento.PACIENTE} | Espécie: ${atendimento.especie}</p>`;

      } else if (situacao === "EM OBSERVAÇAO") {
        divobs.innerHTML += 
          `<p>Paciente: ${atendimento.PACIENTE} | Espécie: ${atendimento.especie}</p>`;
      } else if (situacao === "EM INTERNAÇÃO") {
        divInterna.innerHTML +=          
        `<p>Paciente: ${atendimento.PACIENTE} | Espécie: ${atendimento.especie}</p>`;
      }

    });
  })
  .catch(erro => {
    console.error("Erro ao buscar dados:", erro);
  });
}
  carregarAtendimentos();

setInterval(carregarAtendimentos, 5000);

</script>


</body>
